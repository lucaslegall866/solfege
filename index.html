<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solfège Lab</title>
  <link rel="stylesheet" href="style.css">
  <!-- Bibliothèques externes -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.4/build/cjs/vexflow.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

  <header>
    <div class="logo">Solfège Lab</div>
    <div class="header-right">
      <!-- Sélecteur d'exercice compact dans le header -->
      <select id="exercise-mode" class="compact-select">
        <option value="note-reading">Lecture de Notes</option>
        <option value="rhythm-reading" disabled>Lecture Rythmique (Bientôt)</option>
        <option value="notes-rhythm" disabled>Notes & Rythmes (Bientôt)</option>
      </select>
    </div>
  </header>

  <main class="container">
    <!-- Barre de paramètres compacte -->
    <section class="card settings-card">
      <div class="form-row">
        <div class="form-group">
          <label for="clef-select">Clé(s)</label>
          <select id="clef-select">
            <option value="treble">Clé de Sol</option>
            <option value="bass">Clé de Fa</option>
            <option value="both">Système (Sol + Fa)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="measures-count">Mesures</label>
          <select id="measures-count">
            <option value="1">1 mesure</option>
            <option value="2" selected>2 mesures</option>
            <option value="4">4 mesures</option>
          </select>
        </div>

        <div class="form-group">
          <label for="time-signature">Chiffrage</label>
          <select id="time-signature">
            <option value="4/4">4/4</option>
            <option value="3/4">3/4</option>
          </select>
        </div>

        <div class="form-group">
          <label for="chords-mode">Contenu</label>
          <select id="chords-mode">
            <option value="single">Notes simples</option>
            <option value="mixed" selected>Mélange (Notes & Accords)</option>
            <option value="chords">Accords seuls (2 à 4 sons)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo-input">Tempo (BPM)</label>
          <input type="number" id="tempo-input" value="0" min="0" max="240" step="5">
        </div>
      </div>
    </section>

    <!-- Affichage score & progression -->
    <div class="hud">
      <div class="hud-item">Note : <span id="progress-indicator">0 / 0</span></div>
      <div class="hud-item">
        Précision : <span id="score-indicator">100%</span>
        <button id="reset-score-btn" class="icon-btn" title="Réinitialiser le score">↺ Reset</button>
      </div>
    </div>

    <!-- Zone partition VexFlow -->
    <div id="score-wrapper">
      <div id="score-container"></div>
    </div>

    <!-- Clavier de saisie -->
    <section class="keyboard-container">
      <div class="keyboard" id="keyboard"></div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
